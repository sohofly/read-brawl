async function open_(pw){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:250000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},key,u(D.c));return new TextDecoder().decode(pt)}
async function go(pw,remember){try{const h=await open_(pw);try{sessionStorage.setItem('rb_pw',pw)}catch(x){}if(remember){try{localStorage.setItem('rb_pw',pw)}catch(e){}}document.open();document.write(h);document.close()}
 catch(e){try{localStorage.removeItem('rb_pw')}catch(x){}document.getElementById('e').textContent='密碼錯誤，請再試一次'}}
